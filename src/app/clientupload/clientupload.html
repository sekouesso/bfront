<div class="p-4 bg-white rounded-xl border border-gray-200 shadow-sm max-w-md">
  <h3 class="text-lg font-semibold text-gray-800 mb-4">Changer la photo de profil</h3>
  <h1>{{clientId()}}</h1>
  <!-- Messages de notification -->
  @if (errorMessage()) {
    <div class="p-3 mb-4 text-xs text-red-800 bg-red-50 rounded-lg border border-red-200">
      {{ errorMessage() }}
    </div>
  }

  @if (successMessage()) {
    <div class="p-3 mb-4 text-xs text-green-800 bg-green-50 rounded-lg border border-green-200">
      {{ successMessage() }}
    </div>
  }

  <!-- Zone de sélection / Drag and Drop -->
  <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg p-6 bg-gray-50 hover:bg-gray-100 transition cursor-pointer mb-4">

    @if (previewUrl()) {
      <img [src]="previewUrl()" alt="Prévisualisation" class="w-32 h-32 object-cover rounded-full shadow-md mb-3" />
      <p class="text-xs text-gray-500">{{ selectedFile()?.name }}</p>
    } @else {
      <svg class="w-10 h-10 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      <span class="text-sm font-medium text-gray-600">Cliquez pour sélectionner une photo</span>
      <span class="text-xs text-gray-400 mt-1">PNG, JPG, WEBP jusqu'à 5MB</span>
    }

    <input
      type="file"
      accept="image/*"
      (change)="onFileSelected($event)"
      class="hidden"
      #fileInput />
    <button
      type="button"
      (click)="fileInput.click()"
      class="mt-3 px-3 py-1.5 text-xs text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
      {{ selectedFile() ? 'Changer d\'image' : 'Parcourir' }}
    </button>
  </div>

  <!-- Bouton d'action d'envoi -->
  <button
    type="button"
    (click)="uploadPhoto()"
    [disabled]="!selectedFile() || isUploading()"
    class="w-full py-2 px-4 bg-blue-600 text-white font-medium text-sm rounded-lg shadow-sm hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition">
    {{ isUploading() ? 'Envoi en cours...' : 'Enregistrer la photo' }}
  </button>
</div>
